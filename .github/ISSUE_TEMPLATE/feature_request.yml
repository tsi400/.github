name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the feature you'd like. If this maps to a Linear issue, include the identifier in the title.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? Why is it needed?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you've thought about

  - type: dropdown
    id: complexity
    attributes:
      label: Estimated Complexity
      options:
        - Small — < 1 day
        - Medium — 1-3 days
        - Large — 3+ days
        - Unknown

  - type: input
    id: linear-id
    attributes:
      label: Linear Issue ID
      placeholder: "TSI-"

  - type: checkboxes
    id: duplicates
    attributes:
      label: Duplicate Check
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
