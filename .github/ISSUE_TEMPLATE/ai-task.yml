name: AI Task
description: Task for Claude Code or agent-assisted development
labels: ["ai-task"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should the AI agent accomplish?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Relevant files, services, or background information

  - type: textarea
    id: scope
    attributes:
      label: Scope & Constraints
      description: What's in scope and out of scope? Any constraints?

  - type: textarea
    id: done
    attributes:
      label: Definition of Done
      description: How do we know this is complete?
    validations:
      required: true

  - type: input
    id: linear-id
    attributes:
      label: Linear Issue ID
      placeholder: "TSI-"
