name: Docker Build & Push

# Reusable Docker build + push to GHCR.
#
# Usage:
#   jobs:
#     docker:
#       uses: tsi400/.github/.github/workflows/docker-build-push.yml@main
#       with:
#         image-name: my-service
#       secrets: inherit
#       permissions:
#         packages: write
#         contents: read

on:
  workflow_call:
    inputs:
      image-name:
        description: "Image name (without registry prefix)"
        type: string
        required: true
      dockerfile:
        type: string
        default: Dockerfile
      context:
        type: string
        default: '.'
      push:
        description: "Push image to registry"
        type: boolean
        default: true
      platforms:
        type: string
        default: linux/amd64
      build-args:
        description: "Docker build args (newline-separated KEY=VALUE)"
        type: string
        default: ''
    outputs:
      image-ref:
        description: "Full image reference with digest"
        value: ${{ jobs.build.outputs.image-ref }}
      tags:
        description: "Generated tags"
        value: ${{ jobs.build.outputs.tags }}

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    outputs:
      image-ref: ${{ steps.meta.outputs.tags }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Build and push
        uses: docker/build-push-action@4a13e500e55cf31b7a5d59a38ab2040ab0f42f56 # v5.1.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
