name: CI — Node.js

# Reusable CI workflow for Node.js projects.
#
# Usage:
#   jobs:
#     ci:
#       uses: tsi400/.github/.github/workflows/ci-node.yml@main
#       with:
#         node-version: '20'
#         package-manager: npm
#       secrets: inherit

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        type: string
        default: '20'
      package-manager:
        description: "npm or pnpm"
        type: string
        default: npm
      pnpm-version:
        description: "pnpm version (when package-manager is pnpm)"
        type: string
        default: '9'
      working-directory:
        description: "Working directory for monorepo paths"
        type: string
        default: '.'
      run-lint:
        type: boolean
        default: true
      run-typecheck:
        type: boolean
        default: true
      run-tests:
        type: boolean
        default: true
      run-build:
        type: boolean
        default: true
      test-command:
        description: "Custom test command (default: npm test / pnpm test)"
        type: string
        default: ''
      lint-command:
        description: "Custom lint command"
        type: string
        default: ''
      typecheck-command:
        description: "Custom typecheck command"
        type: string
        default: ''
      build-command:
        description: "Custom build command"
        type: string
        default: ''
      upload-coverage:
        type: boolean
        default: false
      artifact-retention-days:
        type: number
        default: 7

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Enable corepack (pnpm)
        if: inputs.package-manager == 'pnpm'
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Lint
        if: inputs.run-lint
        run: ${{ inputs.lint-command || format('{0} run lint', inputs.package-manager) }}

      - name: Type check
        if: inputs.run-typecheck
        run: ${{ inputs.typecheck-command || format('{0} run typeCheck', inputs.package-manager) }}

      - name: Test
        if: inputs.run-tests
        run: ${{ inputs.test-command || format('{0} test', inputs.package-manager) }}

      - name: Build
        if: inputs.run-build
        run: ${{ inputs.build-command || format('{0} run build', inputs.package-manager) }}
        continue-on-error: true

      - name: Upload coverage
        if: inputs.upload-coverage && inputs.run-tests && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            ${{ inputs.working-directory }}/coverage/
            ${{ inputs.working-directory }}/test-results/
          retention-days: ${{ inputs.artifact-retention-days }}
