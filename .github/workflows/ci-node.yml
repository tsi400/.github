name: CI — Node.js

# Reusable CI workflow for Node.js projects.
#
# Usage:
#   jobs:
#     ci:
#       uses: tsi400/.github/.github/workflows/ci-node.yml@main
#       with:
#         node-version: '20'
#         package-manager: npm
#       secrets: inherit

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        type: string
        default: '20'
      package-manager:
        description: "npm or pnpm"
        type: string
        default: npm
      pnpm-version:
        description: "pnpm version (when package-manager is pnpm)"
        type: string
        default: '9'
      working-directory:
        description: "Working directory for monorepo paths"
        type: string
        default: '.'
      run-lint:
        type: boolean
        default: true
      run-typecheck:
        type: boolean
        default: true
      run-tests:
        type: boolean
        default: true
      run-build:
        type: boolean
        default: true
      test-command:
        description: "Custom test command (default: npm test / pnpm test)"
        type: string
        default: ''
      lint-command:
        description: "Custom lint command"
        type: string
        default: ''
      typecheck-command:
        description: "Custom typecheck command"
        type: string
        default: ''
      build-command:
        description: "Custom build command"
        type: string
        default: ''
      upload-coverage:
        type: boolean
        default: false
      artifact-retention-days:
        type: number
        default: 7

jobs:
  pick-runner:
    uses: tsi400/.github/.github/workflows/pick-runner.yml@main
    secrets: inherit

  ci:
    name: Build & Test
    needs: [pick-runner]
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 60
    concurrency:
      group: ci-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Enable corepack (pnpm)
        if: inputs.package-manager == 'pnpm'
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        env:
          # Lets package.json + .npmrc files reference @tsi400/* scoped packages
          # from GitHub Packages. GH Packages npm requires an auth token even
          # for public packages, and the auto-generated GITHUB_TOKEN already has
          # the right permissions for any tsi400 repo.
          # See myLMS PR #1519 chain for the install-time auth requirement.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Lint
        if: inputs.run-lint
        run: ${{ inputs.lint-command || format('{0} run lint', inputs.package-manager) }}

      - name: Type check
        if: inputs.run-typecheck
        run: ${{ inputs.typecheck-command || format('{0} run typeCheck', inputs.package-manager) }}

      - name: Test
        if: inputs.run-tests
        run: ${{ inputs.test-command || format('{0} test', inputs.package-manager) }}

      - name: Build
        if: inputs.run-build
        run: ${{ inputs.build-command || format('{0} run build', inputs.package-manager) }}
        continue-on-error: true

      - name: Upload coverage
        if: inputs.upload-coverage && inputs.run-tests && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            ${{ inputs.working-directory }}/coverage/
            ${{ inputs.working-directory }}/test-results/
          retention-days: ${{ inputs.artifact-retention-days }}
