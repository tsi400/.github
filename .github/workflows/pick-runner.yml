name: Pick Runner

# Org-level reusable workflow — checks GitHub Actions free tier across
# both tsi400 and wayfong orgs and returns the best runner label.
#
# CI runner priority:
#   1. tsi400 GitHub-hosted  (free minutes remaining)
#   2. wayfong GitHub-hosted (free minutes remaining)
#   3. wayfong GCP self-hosted
#   4. tsi400 GCP self-hosted
#
# Agent/swarm runner priority:
#   1. wayfong GCP self-hosted (max 16 concurrent)
#   2. tsi400 GCP self-hosted  (max 16 concurrent)
#
# Prerequisites:
#   Org secret ORG_BILLING_PAT — a PAT with read:org scope for both orgs.
#
# Usage:
#   jobs:
#     pick-runner:
#       uses: tsi400/.github/.github/workflows/pick-runner.yml@main
#       secrets: inherit
#
#     my-job:
#       needs: [pick-runner]
#       runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}

on:
  workflow_call:
    inputs:
      mode:
        description: "'ci' for build/test jobs, 'agent' for swarm/agent workloads"
        type: string
        default: ci
      prefer-self-hosted:
        description: "Skip free tier check, always use self-hosted"
        type: boolean
        default: false
    outputs:
      runner:
        description: "Runner label to use (JSON array string)"
        value: ${{ jobs.pick.outputs.runner }}
      runner-type:
        description: "Type selected: github-hosted | wayfong-gcp | tsi400-gcp"
        value: ${{ jobs.pick.outputs.runner-type }}

jobs:
  pick:
    name: Pick Runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.decide.outputs.runner }}
      runner-type: ${{ steps.decide.outputs.runner-type }}
    steps:
      - name: Pick runner
        id: decide
        env:
          GH_TOKEN: ${{ secrets.ORG_BILLING_PAT }}
          GH_TOKEN_FALLBACK: ${{ secrets.GITHUB_TOKEN }}
          PREFER_SELF_HOSTED: ${{ inputs.prefer-self-hosted }}
          MODE: ${{ inputs.mode }}
        run: |
          # GitHub Enterprise: 50,000 min/month
          # GitHub Team/Pro: 3,000 min/month
          # GitHub Free: 2,000 min/month
          FREE_TIER_LIMIT=50000
          BUFFER=500

          TOKEN="${GH_TOKEN:-$GH_TOKEN_FALLBACK}"

          TSI_HOSTED='["ubuntu-latest"]'
          WF_GCP='["self-hosted","linux","x64","wayfong-gcp"]'
          TSI_GCP='["self-hosted","linux","x64","tsi-gcp"]'

          # --- Agent mode: always self-hosted, wayfong first ---
          if [ "$MODE" = "agent" ]; then
            echo "Agent mode — wayfong GCP primary (max 16)"
            echo "runner=$WF_GCP" >> $GITHUB_OUTPUT
            echo "runner-type=wayfong-gcp" >> $GITHUB_OUTPUT
            exit 0
          fi

          # --- Forced self-hosted ---
          if [ "$PREFER_SELF_HOSTED" = "true" ]; then
            echo "runner=$WF_GCP" >> $GITHUB_OUTPUT
            echo "runner-type=wayfong-gcp" >> $GITHUB_OUTPUT
            exit 0
          fi

          # --- CI mode: check free tiers in priority order ---
          check_org_minutes() {
            local ORG="$1"
            local HTTP_CODE
            HTTP_CODE=$(curl -s -o /tmp/billing_${ORG}.json -w "%{http_code}" \
              -H "Authorization: token $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/${ORG}/settings/billing/usage" 2>/dev/null)

            if [ "$HTTP_CODE" != "200" ]; then
              echo "-1"
              return
            fi

            local USED
            USED=$(jq '[.usageItems[] | select(.product == "actions")] | map(.quantity) | add // 0' /tmp/billing_${ORG}.json 2>/dev/null)
            if [ -z "$USED" ] || [ "$USED" = "null" ]; then
              echo "-1"
              return
            fi
            echo $(( FREE_TIER_LIMIT - ${USED%.*} ))
          }

          # Priority 1: tsi400 GitHub-hosted
          TSI_REMAINING=$(check_org_minutes "tsi400")
          echo "tsi400 free minutes remaining: ~${TSI_REMAINING}"
          if [ "$TSI_REMAINING" -gt "$BUFFER" ] 2>/dev/null; then
            echo "runner=$TSI_HOSTED" >> $GITHUB_OUTPUT
            echo "runner-type=github-hosted" >> $GITHUB_OUTPUT
            echo "Using tsi400 GitHub-hosted ($TSI_REMAINING min remaining)"
            exit 0
          fi

          # Priority 2: wayfong GitHub-hosted
          WF_REMAINING=$(check_org_minutes "wayfong")
          echo "wayfong free minutes remaining: ~${WF_REMAINING}"
          if [ "$WF_REMAINING" -gt "$BUFFER" ] 2>/dev/null; then
            echo "runner=$TSI_HOSTED" >> $GITHUB_OUTPUT
            echo "runner-type=github-hosted" >> $GITHUB_OUTPUT
            echo "Using wayfong GitHub-hosted ($WF_REMAINING min remaining)"
            exit 0
          fi

          # Priority 3: wayfong GCP self-hosted
          echo "Free tiers exhausted — wayfong GCP self-hosted"
          echo "runner=$WF_GCP" >> $GITHUB_OUTPUT
          echo "runner-type=wayfong-gcp" >> $GITHUB_OUTPUT
          # Priority 4 (tsi400 GCP) is handled by runner group overflow
          # if wayfong GCP is at capacity
