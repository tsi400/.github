name: Pick Runner

# Org-level reusable workflow — checks GitHub Actions free tier across
# both tsi400 and wayfong orgs and returns the best runner label.
#
# CI runner priority:
#   1. GitHub-hosted (free minutes remaining in either org)
#   2. Self-hosted GCP (org-aware: tsi-gcp for tsi400, wayfong-gcp for wayfong)
#
# Agent/swarm runner priority:
#   Always self-hosted (org-aware)
#
# Prerequisites:
#   Org secret ORG_BILLING_PAT — classic PAT with read:org scope for both orgs.
#   Visibility must be "all" (not "private") so public repos can use it.
#
# Usage:
#   jobs:
#     pick-runner:
#       uses: tsi400/.github/.github/workflows/pick-runner.yml@main
#       secrets: inherit
#
#     my-job:
#       needs: [pick-runner]
#       runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}

on:
  workflow_call:
    inputs:
      mode:
        description: "'ci' for build/test jobs, 'agent' for swarm/agent workloads"
        type: string
        default: ci
      prefer-self-hosted:
        description: "Skip free tier check, always use self-hosted"
        type: boolean
        default: false
    outputs:
      runner:
        description: "Runner label to use (JSON array string)"
        value: ${{ jobs.pick.outputs.runner }}
      runner-type:
        description: "Type selected: github-hosted | wayfong-gcp | tsi-gcp"
        value: ${{ jobs.pick.outputs.runner-type }}

jobs:
  pick:
    name: Pick Runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.decide.outputs.runner }}
      runner-type: ${{ steps.decide.outputs.runner-type }}
    steps:
      - name: Pick runner
        id: decide
        env:
          GH_TOKEN: ${{ secrets.ORG_BILLING_PAT }}
          GH_TOKEN_FALLBACK: ${{ secrets.GITHUB_TOKEN }}
          PREFER_SELF_HOSTED: ${{ inputs.prefer-self-hosted }}
          MODE: ${{ inputs.mode }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          FREE_TIER_LIMIT=50000
          BUFFER=500

          TOKEN="${GH_TOKEN:-$GH_TOKEN_FALLBACK}"

          GITHUB_HOSTED='["ubuntu-latest"]'
          WF_GCP='["self-hosted","linux","x64","wayfong-gcp"]'
          TSI_GCP='["self-hosted","linux","x64","tsi-gcp"]'

          # Select self-hosted label based on calling repo's org
          # Runners registered in org A are invisible to repos in org B
          if [ "$REPO_OWNER" = "wayfong" ]; then
            SELF_HOSTED="$WF_GCP"
            SELF_HOSTED_TYPE="wayfong-gcp"
          else
            SELF_HOSTED="$TSI_GCP"
            SELF_HOSTED_TYPE="tsi-gcp"
          fi

          # --- Agent mode: always self-hosted ---
          if [ "$MODE" = "agent" ]; then
            echo "Agent mode — ${SELF_HOSTED_TYPE}"
            echo "runner=$SELF_HOSTED" >> $GITHUB_OUTPUT
            echo "runner-type=$SELF_HOSTED_TYPE" >> $GITHUB_OUTPUT
            exit 0
          fi

          # --- Forced self-hosted ---
          if [ "$PREFER_SELF_HOSTED" = "true" ]; then
            echo "Forced self-hosted — ${SELF_HOSTED_TYPE}"
            echo "runner=$SELF_HOSTED" >> $GITHUB_OUTPUT
            echo "runner-type=$SELF_HOSTED_TYPE" >> $GITHUB_OUTPUT
            exit 0
          fi

          # --- CI mode: check free tiers ---
          # If billing check fails, default to GitHub-hosted (safe fallback)
          check_org_minutes() {
            local ORG="$1"
            local HTTP_CODE
            HTTP_CODE=$(curl -s -o /tmp/billing_${ORG}.json -w "%{http_code}" \
              -H "Authorization: token $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/${ORG}/settings/billing/usage" 2>/dev/null)

            if [ "$HTTP_CODE" != "200" ]; then
              echo "BILLING_CHECK_FAILED"
              return
            fi

            local USED
            USED=$(jq '[.usageItems[] | select(.product == "actions")] | map(.quantity) | add // 0' /tmp/billing_${ORG}.json 2>/dev/null)
            if [ -z "$USED" ] || [ "$USED" = "null" ]; then
              echo "BILLING_CHECK_FAILED"
              return
            fi
            echo $(( FREE_TIER_LIMIT - ${USED%.*} ))
          }

          # Check tsi400 free tier
          TSI_REMAINING=$(check_org_minutes "tsi400")
          echo "tsi400 billing check: ${TSI_REMAINING}"

          # If billing check failed, default to GitHub-hosted
          # (we can't confirm minutes are exhausted, so assume they're not)
          if [ "$TSI_REMAINING" = "BILLING_CHECK_FAILED" ]; then
            echo "::warning::Billing API check failed — defaulting to GitHub-hosted"
            echo "runner=$GITHUB_HOSTED" >> $GITHUB_OUTPUT
            echo "runner-type=github-hosted" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$TSI_REMAINING" -gt "$BUFFER" ] 2>/dev/null; then
            echo "Using GitHub-hosted ($TSI_REMAINING tsi400 min remaining)"
            echo "runner=$GITHUB_HOSTED" >> $GITHUB_OUTPUT
            echo "runner-type=github-hosted" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check wayfong free tier
          WF_REMAINING=$(check_org_minutes "wayfong")
          echo "wayfong billing check: ${WF_REMAINING}"

          if [ "$WF_REMAINING" = "BILLING_CHECK_FAILED" ]; then
            echo "::warning::Billing API check failed — defaulting to GitHub-hosted"
            echo "runner=$GITHUB_HOSTED" >> $GITHUB_OUTPUT
            echo "runner-type=github-hosted" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$WF_REMAINING" -gt "$BUFFER" ] 2>/dev/null; then
            echo "Using GitHub-hosted ($WF_REMAINING wayfong min remaining)"
            echo "runner=$GITHUB_HOSTED" >> $GITHUB_OUTPUT
            echo "runner-type=github-hosted" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Both orgs exhausted — use self-hosted
          echo "Free tiers exhausted — ${SELF_HOSTED_TYPE} self-hosted"
          echo "runner=$SELF_HOSTED" >> $GITHUB_OUTPUT
          echo "runner-type=$SELF_HOSTED_TYPE" >> $GITHUB_OUTPUT
