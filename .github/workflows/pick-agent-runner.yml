name: Pick Agent Runner

# Agent/swarm runner picker — always self-hosted, org-aware.
# Selects the correct runner pool based on the calling repo's org.
#
# Usage:
#   jobs:
#     pick:
#       uses: tsi400/.github/.github/workflows/pick-agent-runner.yml@main
#       secrets: inherit
#
#     agent-job:
#       needs: [pick]
#       runs-on: ${{ fromJSON(needs.pick.outputs.runner) }}

on:
  workflow_call:
    inputs:
      prefer-tsi:
        description: "Force tsi400 GCP regardless of calling org"
        type: boolean
        default: false
      prefer-wayfong:
        description: "Force wayfong GCP regardless of calling org"
        type: boolean
        default: false
    outputs:
      runner:
        description: "Runner label (JSON array)"
        value: ${{ jobs.pick.outputs.runner }}
      runner-type:
        description: "wayfong-gcp or tsi-gcp"
        value: ${{ jobs.pick.outputs.runner-type }}
      max-concurrent:
        description: "Max concurrent agents on this runner pool"
        value: ${{ jobs.pick.outputs.max-concurrent }}

jobs:
  pick:
    name: Pick Agent Runner
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.decide.outputs.runner }}
      runner-type: ${{ steps.decide.outputs.runner-type }}
      max-concurrent: ${{ steps.decide.outputs.max-concurrent }}
    steps:
      - name: Select agent runner pool
        id: decide
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          WF_GCP='["self-hosted","linux","x64","wayfong-gcp"]'
          TSI_GCP='["self-hosted","linux","x64","tsi-gcp"]'

          if [ "${{ inputs.prefer-tsi }}" = "true" ]; then
            echo "runner=$TSI_GCP" >> $GITHUB_OUTPUT
            echo "runner-type=tsi-gcp" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.prefer-wayfong }}" = "true" ]; then
            echo "runner=$WF_GCP" >> $GITHUB_OUTPUT
            echo "runner-type=wayfong-gcp" >> $GITHUB_OUTPUT
          elif [ "$REPO_OWNER" = "wayfong" ]; then
            echo "runner=$WF_GCP" >> $GITHUB_OUTPUT
            echo "runner-type=wayfong-gcp" >> $GITHUB_OUTPUT
          else
            echo "runner=$TSI_GCP" >> $GITHUB_OUTPUT
            echo "runner-type=tsi-gcp" >> $GITHUB_OUTPUT
          fi
          echo "max-concurrent=16" >> $GITHUB_OUTPUT
