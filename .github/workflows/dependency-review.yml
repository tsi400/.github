name: Dependency Review

# Reusable dependency review for PRs — checks for vulnerabilities
# and license violations.
#
# Usage:
#   jobs:
#     deps:
#       uses: tsi400/.github/.github/workflows/dependency-review.yml@main
#       permissions:
#         contents: read
#         pull-requests: write

on:
  workflow_call:
    inputs:
      deny-licenses:
        description: "Comma-separated SPDX license IDs to deny"
        type: string
        default: GPL-3.0-only,GPL-3.0-or-later,AGPL-3.0-only,AGPL-3.0-or-later
      fail-on-severity:
        type: string
        default: moderate

jobs:
  pick-runner:
    uses: tsi400/.github/.github/workflows/pick-runner.yml@main
    secrets: inherit

  review:
    name: Dependency Review
    needs: [pick-runner]
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          deny-licenses: ${{ inputs.deny-licenses }}
          fail-on-severity: ${{ inputs.fail-on-severity }}
          comment-summary-in-pr: always
