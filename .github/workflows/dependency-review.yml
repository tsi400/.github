name: Dependency Review

# Reusable dependency review for PRs — checks for vulnerabilities
# and license violations.
#
# Usage:
#   jobs:
#     deps:
#       uses: tsi400/.github/.github/workflows/dependency-review.yml@main
#       permissions:
#         contents: read
#         pull-requests: write

on:
  workflow_call:
    inputs:
      deny-licenses:
        description: "Comma-separated SPDX license IDs to deny"
        type: string
        default: GPL-3.0-only,GPL-3.0-or-later,AGPL-3.0-only,AGPL-3.0-or-later
      fail-on-severity:
        type: string
        default: moderate

jobs:
  review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@4901385134134e04cec5fbe5ddfe3b2c5bd5d976 # v4.5.0
        with:
          deny-licenses: ${{ inputs.deny-licenses }}
          fail-on-severity: ${{ inputs.fail-on-severity }}
          comment-summary-in-pr: always
