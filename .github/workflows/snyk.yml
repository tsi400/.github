name: Snyk

# Reusable Snyk vulnerability scanning (dependencies + optional container).
#
# Usage:
#   jobs:
#     snyk:
#       uses: tsi400/.github/.github/workflows/snyk.yml@main
#       with:
#         node-version: '20'
#         scan-container: true
#         image-name: my-service
#       secrets: inherit

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '20'
      package-manager:
        type: string
        default: npm
      scan-container:
        type: boolean
        default: false
      image-name:
        type: string
        default: app
      severity-threshold:
        type: string
        default: medium

jobs:
  dependencies:
    name: Dependency Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            corepack enable && pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Snyk test
        uses: snyk/actions/node@cdb760004ba9ea4d525f2e043745dfe85bb9077e # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=${{ inputs.severity-threshold }} --sarif-file-output=snyk-deps.sarif
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
        with:
          sarif_file: snyk-deps.sarif

  container:
    name: Container Scan
    if: inputs.scan-container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build image
        run: docker build -t ${{ inputs.image-name }}:${{ github.sha }} .

      - name: Snyk container test
        uses: snyk/actions/docker@cdb760004ba9ea4d525f2e043745dfe85bb9077e # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ inputs.image-name }}:${{ github.sha }}
          args: --severity-threshold=${{ inputs.severity-threshold }} --sarif-file-output=snyk-container.sarif
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
        with:
          sarif_file: snyk-container.sarif
