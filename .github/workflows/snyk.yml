name: Snyk

# Reusable Snyk vulnerability scanning (dependencies + optional container).
#
# Usage:
#   jobs:
#     snyk:
#       uses: tsi400/.github/.github/workflows/snyk.yml@main
#       with:
#         node-version: '20'
#         scan-container: true
#         image-name: my-service
#       secrets: inherit

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '20'
      package-manager:
        type: string
        default: npm
      scan-container:
        type: boolean
        default: false
      image-name:
        type: string
        default: app
      severity-threshold:
        type: string
        default: medium

jobs:
  pick-runner:
    uses: tsi400/.github/.github/workflows/pick-runner.yml@main
    secrets: inherit

  dependencies:
    name: Dependency Scan
    needs: [pick-runner]
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            corepack enable && pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Snyk test
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=${{ inputs.severity-threshold }} --sarif-file-output=snyk-deps.sarif
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@7fc6561ed893d15cec696e062df840b21db27eb0 # v4.35.2
        with:
          sarif_file: snyk-deps.sarif

  container:
    name: Container Scan
    if: inputs.scan-container
    needs: [pick-runner]
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build image
        run: docker build -t ${{ inputs.image-name }}:${{ github.sha }} .

      - name: Snyk container test
        uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ inputs.image-name }}:${{ github.sha }}
          args: --severity-threshold=${{ inputs.severity-threshold }} --sarif-file-output=snyk-container.sarif
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@7fc6561ed893d15cec696e062df840b21db27eb0 # v4.35.2
        with:
          sarif_file: snyk-container.sarif
