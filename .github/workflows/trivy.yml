name: Trivy

# Reusable Trivy vulnerability scanning (filesystem + optional container).
#
# Usage:
#   jobs:
#     trivy:
#       uses: tsi400/.github/.github/workflows/trivy.yml@main
#       with:
#         scan-container: true
#         image-name: my-service
#       permissions:
#         security-events: write
#         contents: read
#         actions: read
#         id-token: write

on:
  workflow_call:
    inputs:
      scan-container:
        description: "Also scan Docker image (requires Dockerfile)"
        type: boolean
        default: false
      image-name:
        description: "Docker image name for container scan"
        type: string
        default: app
      severity:
        description: "Severity levels to report"
        type: string
        default: CRITICAL,HIGH

jobs:
  filesystem:
    name: Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          severity: ${{ inputs.severity }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@7fc6561ed893d15cec696e062df840b21db27eb0 # v4.35.2
        with:
          sarif_file: trivy-fs.sarif

  container:
    name: Container Scan
    if: inputs.scan-container
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build image
        run: docker build -t ${{ inputs.image-name }}:${{ github.sha }} .

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ inputs.image-name }}:${{ github.sha }}
          format: sarif
          output: trivy-container.sarif
          severity: ${{ inputs.severity }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@7fc6561ed893d15cec696e062df840b21db27eb0 # v4.35.2
        with:
          sarif_file: trivy-container.sarif
