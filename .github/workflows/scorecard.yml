name: Scorecard

# Reusable OpenSSF Scorecard analysis.
#
# Usage:
#   jobs:
#     scorecard:
#       uses: tsi400/.github/.github/workflows/scorecard.yml@main
#       permissions:
#         security-events: write
#         id-token: write
#         contents: read
#       secrets: inherit

on:
  workflow_call:
    inputs:
      publish-results:
        description: "Publish to OpenSSF REST API (set false for private repos)"
        type: boolean
        default: true

jobs:
  pick-runner:
    uses: tsi400/.github/.github/workflows/pick-runner.yml@main
    secrets: inherit

  analysis:
    name: Scorecard Analysis
    needs: [pick-runner]
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 60
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish-results }}
          repo_token: ${{ secrets.WF_ORG_TOKEN || github.token }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@7fc6561ed893d15cec696e062df840b21db27eb0 # v4.35.2
        with:
          sarif_file: results.sarif

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30
